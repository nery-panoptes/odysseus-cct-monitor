# Exemplo para um repositório operacional privado.
# Para ativar, copie este arquivo para:
# .github/workflows/odysseus-daily.yml
#
# Cadastre os secrets:
# - ODYSSEUS_CONFIG_TOML: conteúdo completo do config.toml real.
# - ODYSSEUS_SMTP_USER: usuário SMTP.
# - ODYSSEUS_SMTP_PASS: senha de app SMTP.
#
# Atenção: se o banco SQLite tiver dados internos, não rode este fluxo em
# repositório público com cache de dados. Use um repositório privado.

name: Odysséus Daily

on:
  workflow_dispatch:
  schedule:
    # 08:30 no horário de Brasília, que equivale a 11:30 UTC.
    - cron: "30 11 * * *"

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore local database cache
        uses: actions/cache@v4
        with:
          path: data
          key: odysseus-data-${{ github.run_id }}
          restore-keys: |
            odysseus-data-

      - name: Write config
        run: |
          printf '%s' "${{ secrets.ODYSSEUS_CONFIG_TOML }}" > config.toml

      - name: Run daily monitor
        env:
          ODYSSEUS_SMTP_USER: ${{ secrets.ODYSSEUS_SMTP_USER }}
          ODYSSEUS_SMTP_PASS: ${{ secrets.ODYSSEUS_SMTP_PASS }}
        run: |
          mkdir -p logs
          python -u app.py daily | tee "logs/daily-$(date +'%Y-%m-%d-%H-%M').log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-logs
          path: logs/
