[app]
name = "Odysséus"
db = "data/odysses_cct_base.sqlite"
reports = "reports"
logs = "logs"
downloads = "downloads"
outbox = "outbox"

[monitor]
ufs = ["DF", "GO"]
active_only = true
send_duplicates = false
min_registration_year_to_alert = 2025
alert_without_registration_year = false
instrument_types = [
  "acordo",
  "convencao",
  "termoAditivoAcordo",
  "termoAditivoConvecao"
]

[monitor_source]
# Opções:
# - "database": usa os sindicatos já gravados no SQLite local.
# - "google_sheet_filter": usa o SQLite como base bruta e filtra pelos nomes
#   de uma planilha online compartilhada.
# - "google_sheet": usa uma planilha online como fonte direta de sindicatos.
# - "xlsx": usa uma planilha local como fonte direta de sindicatos.
source = "database"
google_sheet_url = ""
source_file = ""
sheet_name = ""
filter_column = "NOME DO SINDICATO"
respect_monitor_ufs = true

[office_companies]
# Ative depois de informar uma planilha privada com CNPJ das empresas/clientes.
enabled = false
source_file = "data/empresas.example.xlsx"
sheet_name = ""
google_sheet_url = ""
refresh_on_daily = true
company_specific_types = ["acordo", "termoAditivoAcordo"]
alert_when_company_unknown = true

[summary]
# "IA" local do Odysséus: extração de texto + regras de leitura, sem API paga.
enabled = true
max_bullets = 5
include_file_type_note = true
ocr_enabled = false
ocr_language = "por"

[email]
enabled = true
provider = "smtp"
smtp_host = "smtp.gmail.com"
smtp_port = 587
use_tls = true

from_email = "seu-email@seudominio.com"
from_name = "Odysséus, Robô de Monitoramento de Convenções Coletivas"

to = ["destinatario@seudominio.com"]
cc = []
bcc = []

subject_prefix = "ColeConv"
send_when_empty = true
attach_report = true
attach_new_files = true
banner_path = ""
banner_width = 360
dry_run = true

max_new_items_to_send = 50

[mte]
timeout = 120
delay = 2.5
max_pages = 1000
http_backend = "auto"
impersonate = "chrome"
blocked_abort_after = 2
recaptcha_token = ""
